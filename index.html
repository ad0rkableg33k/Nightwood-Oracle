<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightwood Oracle & Cutesy Chaos Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Creepster&family=Fredoka+One&family=Ribeye&family=Rye&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#0a0a0f; --deep:#0d1117; --gold:#c9a84c; --gold-dim:#7a6230;
  --gold-glow:#e8c96a; --teal-lit:#4db8b8; --cream:#f0e8d5;
  --mist:#a89f8c; --fog:#5c5650; --red-dim:#6b2020;
  --hot-pink:#c0426e; --purple:#5a2299; --lavender:#9b6fb5;
  --f-display:'Cinzel Decorative',serif; --f-title:'Cinzel',serif;
  --f-body:'EB Garamond',serif; --f-chaos:'Rye',cursive;
  --f-chaos-sub:'Fredoka One',cursive;
  --card-w:300px; --card-h:523px; --card-r:14px;
}
html { scroll-behavior:smooth; }
body { background:var(--ink); color:var(--cream); font-family:var(--f-body);
  font-size:17px; line-height:1.7; min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:9999; opacity:0.6; }

/* BACKGROUNDS */
.forest-bg { position:fixed; inset:0; z-index:0; transition:opacity 0.8s;
  background: radial-gradient(ellipse 60% 50% at 50% 100%,#0d2210 0%,transparent 70%),
    radial-gradient(ellipse 100% 60% at 50% 110%,#060e04 0%,transparent 60%),
    linear-gradient(180deg,#050508 0%,#080d06 40%,#040804 100%); }
.chaos-bg { position:fixed; inset:0; z-index:0; opacity:0; transition:opacity 0.8s;
  background: radial-gradient(ellipse 80% 50% at 20% 20%,rgba(80,20,140,0.25) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(150,30,80,0.15) 0%,transparent 60%),
    linear-gradient(180deg,#050008 0%,#080010 50%,#030005 100%); }
body.chaos-mode .forest-bg { opacity:0; }
body.chaos-mode .chaos-bg  { opacity:1; }

/* PARTICLES */
.fireflies,.skulls { position:fixed; inset:0; z-index:1; pointer-events:none; }
.skulls { opacity:0; transition: opacity 0.8s; }
body.chaos-mode .skulls { opacity:1; }
body.chaos-mode .fireflies { opacity:0; }
.firefly { position:absolute; width:3px; height:3px; border-radius:50%;
  background:var(--gold-glow); box-shadow:0 0 6px 2px rgba(232,201,106,0.6);
  animation:drift var(--dur,8s) ease-in-out infinite var(--delay,0s); opacity:0; }
.skull-p { position:absolute; font-size:var(--sz,14px); opacity:0;
  animation:floatUp var(--dur,8s) ease-in infinite var(--delay,0s); }
@keyframes drift {
  0%{opacity:0;transform:translate(0,0) scale(0.5)} 20%{opacity:0.8}
  50%{opacity:0.4;transform:translate(var(--tx,20px),var(--ty,-30px)) scale(1)}
  80%{opacity:0.7} 100%{opacity:0;transform:translate(var(--tx2,40px),var(--ty2,-60px)) scale(0.3)} }
@keyframes floatUp {
  0%{opacity:0;transform:translateY(100vh) rotate(0deg)} 10%{opacity:0.4}
  90%{opacity:0.2} 100%{opacity:0;transform:translateY(-20vh) rotate(360deg)} }

.app { position:relative; z-index:2; min-height:100vh; }

/* HEADER */
header { text-align:center; padding:60px 20px 40px; position:relative; }
.header-rune { font-size:11px; letter-spacing:6px; text-transform:uppercase;
  color:var(--gold-dim); font-family:var(--f-title); margin-bottom:16px; display:block; }
header h1 { font-family:var(--f-display); font-size:clamp(32px,6vw,64px);
  font-weight:900; color:var(--gold);
  text-shadow:0 0 40px rgba(201,168,76,0.4),0 0 80px rgba(201,168,76,0.15);
  line-height:1.1; letter-spacing:2px; transition:all 0.5s; }
header h1 span { display:block; font-size:0.45em; font-weight:400; color:var(--mist);
  letter-spacing:8px; margin-top:6px; font-family:var(--f-title); }
.header-divider { display:flex; align-items:center; gap:16px;
  max-width:400px; margin:24px auto 0; }
.header-divider::before,.header-divider::after { content:''; flex:1; height:1px; }
.header-divider::before { background:linear-gradient(90deg,transparent,var(--gold-dim)); }
.header-divider::after  { background:linear-gradient(90deg,var(--gold-dim),transparent); }
.header-divider span { color:var(--gold); font-size:18px; }

/* DECK BANNERS */
.deck-banners { display:flex; flex-wrap:wrap; gap:16px; justify-content:center;
  max-width:1100px; margin:0 auto 10px; padding:0 20px; }
.deck-banners-label { text-align:center; font-family:var(--f-title); font-size:11px;
  letter-spacing:4px; text-transform:uppercase; color:var(--fog); margin-bottom:12px; }
.deck-banner { border-radius:12px; overflow:visible; cursor:pointer;
  border:3px solid transparent; transition:all 0.35s; opacity:0.45;
  position:relative; filter:saturate(0.4) brightness(0.7); }
.deck-banner::after { content:'SELECT'; position:absolute; bottom:-26px; left:50%;
  transform:translateX(-50%); font-family:var(--f-title); font-size:10px;
  letter-spacing:3px; color:var(--fog); opacity:0; transition:opacity 0.3s; white-space:nowrap; }
.deck-banner:hover { opacity:0.85; filter:saturate(0.8) brightness(0.9);
  transform:translateY(-3px); }
.deck-banner:hover::after { opacity:1; }
.deck-banner.active { border-color:var(--gold); opacity:1;
  box-shadow:0 0 30px rgba(201,168,76,0.4), 0 0 60px rgba(201,168,76,0.15);
  filter:saturate(1) brightness(1); transform:none; }
.deck-banner.active::after { content:'✦ ACTIVE'; color:var(--gold); opacity:1; }
.deck-banner.active:hover { transform:none; }
.deck-banner img { width:100%; max-width:500px; height:auto;
  max-height:166px; object-fit:cover; object-position:center; display:block; border-radius:8px; }
.banner-fallback { padding:14px 30px; text-align:center;
  letter-spacing:3px; font-size:15px; border-radius:8px; display:block; }
.banner-nightwood { background:rgba(201,168,76,0.1); color:#c9a84c;
  font-family:'Cinzel',serif; }
.banner-chaos { background:rgba(255,45,138,0.1); color:#ff2d8a;
  font-family:'Creepster',cursive; font-size:20px; }
.deck-banner img.loaded { display:block; }
.deck-banner img.loaded ~ .banner-fallback { display:none; }
body.chaos-mode .deck-banner.active { border-color:var(--hot-pink);
  box-shadow:0 0 30px rgba(255,45,138,0.5), 0 0 60px rgba(255,45,138,0.2); }
body.chaos-mode .deck-banner.active::after { color:var(--hot-pink); }

/* CHAOS HEADER */
body.chaos-mode header h1 { color:#1a0212;
  font-family:var(--f-chaos);
  -webkit-text-stroke: 1px #6b0a35;
  text-shadow:
    0 0 8px #ff2d8a,
    0 0 16px #ff2d8a,
    0 0 30px rgba(255,45,138,0.7),
    0 0 60px rgba(255,45,138,0.3),
    0 0 100px rgba(180,20,80,0.2); }
body.chaos-mode .header-rune { color:#7a4060; font-family:var(--f-chaos-sub); }
body.chaos-mode .header-divider span { color:#8b1a4a; }

/* MODE TABS */
.mode-section { max-width:900px; margin:0 auto; padding:20px 20px 0; text-align:center; }
.mode-section h2 { font-family:var(--f-title); font-size:13px; letter-spacing:4px;
  text-transform:uppercase; color:var(--fog); margin-bottom:16px; }
.mode-tabs { display:inline-flex; background:rgba(255,255,255,0.03);
  border:1px solid rgba(201,168,76,0.15); border-radius:50px; padding:4px; gap:4px; }
body.chaos-mode .mode-tabs { border-color:rgba(255,45,138,0.2); }
.mode-tab { padding:10px 24px; border-radius:40px; border:none; background:transparent;
  color:var(--fog); font-family:var(--f-title); font-size:13px; letter-spacing:2px;
  text-transform:uppercase; cursor:pointer; transition:all 0.3s; }
.mode-tab:hover { color:var(--cream); }
.mode-tab.active { background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  color:var(--ink); font-weight:600; box-shadow:0 0 20px rgba(201,168,76,0.3); }
body.chaos-mode .mode-tab.active { background:linear-gradient(135deg,var(--purple),var(--hot-pink));
  box-shadow:0 0 20px rgba(255,45,138,0.3); }

/* SPREADS */
.spread-section { max-width:900px; margin:30px auto 0; padding:0 20px; text-align:center; }
.spread-section h2 { font-family:var(--f-title); font-size:13px; letter-spacing:4px;
  text-transform:uppercase; color:var(--fog); margin-bottom:16px; }
.spread-options { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.spread-btn { padding:10px 22px; border:1px solid rgba(201,168,76,0.2); border-radius:6px;
  background:rgba(255,255,255,0.02); color:var(--mist); font-family:var(--f-title);
  font-size:12px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all 0.25s; }
.spread-btn:hover { border-color:var(--gold-dim); color:var(--cream); background:rgba(201,168,76,0.06); }
.spread-btn.active { border-color:var(--gold); color:var(--gold);
  background:rgba(201,168,76,0.1); box-shadow:0 0 14px rgba(201,168,76,0.15); }
body.chaos-mode .spread-btn.active { border-color:var(--hot-pink); color:var(--hot-pink);
  background:rgba(255,45,138,0.1); box-shadow:0 0 14px rgba(255,45,138,0.15); }
.spread-desc { margin-top:12px; font-style:italic; color:var(--fog); font-size:14px; min-height:22px; }

/* DRAW BUTTON */
.draw-section { text-align:center; padding:30px 20px 10px; }
.draw-btn { position:relative; padding:18px 52px; background:transparent;
  border:1px solid var(--gold); border-radius:4px; color:var(--gold);
  font-family:var(--f-display); font-size:15px; letter-spacing:3px;
  text-transform:uppercase; cursor:pointer; transition:all 0.4s; overflow:hidden; }
.draw-btn::before { content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,var(--gold-dim),var(--gold)); opacity:0; transition:opacity 0.4s; }
.draw-btn:hover::before { opacity:1; }
.draw-btn:hover { color:var(--ink); box-shadow:0 0 30px rgba(201,168,76,0.4); }
.draw-btn span { position:relative; z-index:1; }
body.chaos-mode .draw-btn { border-color:var(--hot-pink); color:var(--hot-pink);
  font-family:var(--f-chaos-sub); }
body.chaos-mode .draw-btn::before { background:linear-gradient(135deg,var(--purple),var(--hot-pink)); }
body.chaos-mode .draw-btn:hover { color:white; box-shadow:0 0 30px rgba(255,45,138,0.5); }

/* READING AREA */
.reading-area { max-width:1100px; margin:40px auto; padding:0 20px 60px; }
.spread-layout { display:flex; flex-wrap:wrap; gap:30px; justify-content:center; margin-bottom:50px; }
.card-slot { display:flex; flex-direction:column; align-items:center; gap:14px; }
.slot-label { font-family:var(--f-title); font-size:11px; letter-spacing:3px;
  text-transform:uppercase; color:var(--gold-dim); text-align:center; }
body.chaos-mode .slot-label { color:var(--lavender); font-family:var(--f-chaos-sub); font-size:13px; }

/* CARDS */
.card-wrap { width:var(--card-w); height:var(--card-h); perspective:1000px;
  cursor:pointer; opacity:0; transform:translateY(20px);
  animation:dealIn 0.5s ease forwards; }
@keyframes dealIn { to{opacity:1;transform:translateY(0)} }
.card-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d;
  transition:transform 0.7s cubic-bezier(0.4,0,0.2,1); border-radius:var(--card-r); }
.card-wrap.flipped .card-inner { transform:rotateY(180deg); }
.card-face { position:absolute; inset:0; border-radius:var(--card-r);
  backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(201,168,76,0.15); }
body.chaos-mode .card-face { box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 0 1px rgba(255,45,138,0.2),
  0 0 20px rgba(255,45,138,0.1); }
.card-back-face { background:var(--deep); }
.card-back-face img,.card-front-face img { width:100%; height:100%;
  object-fit:cover; border-radius:var(--card-r); }
.card-back-face .placeholder-back { width:100%; height:100%;
  background:linear-gradient(135deg,#0d1a2e,#1a0d2e); display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:12px;
  border:1px solid rgba(201,168,76,0.3); border-radius:var(--card-r); }
.card-front-face { transform:rotateY(180deg); background:var(--deep); }
.card-front-face.card-reversed { transform:rotateY(180deg) rotate(180deg); }
.card-wrap.flipped .card-front-face.card-reversed { transform:rotateY(180deg) rotate(180deg); }
.placeholder-front { width:100%; height:100%;
  background:linear-gradient(160deg,#0d1a0d,#1a130d); display:flex;
  align-items:center; justify-content:center; flex-direction:column;
  padding:20px; text-align:center; border-radius:var(--card-r); }
.reversed-tag { font-family:var(--f-title); font-size:10px; letter-spacing:2px;
  color:var(--red-dim); text-transform:uppercase; display:none; }
.card-slot.is-reversed .reversed-tag { display:block; }

/* MEANING PANEL */
.meaning-panel { max-width:700px; margin:0 auto; display:none; }
.meaning-panel.visible { display:block; animation:fadeUp 0.5s ease forwards; }
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.meaning-card { background:rgba(255,255,255,0.025); border:1px solid rgba(201,168,76,0.2);
  border-radius:12px; padding:36px 40px; margin-bottom:20px; position:relative; overflow:hidden; }
.meaning-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent); }
body.chaos-mode .meaning-card { border-color:rgba(255,45,138,0.2); }
body.chaos-mode .meaning-card::before { background:linear-gradient(90deg,transparent,var(--hot-pink),var(--lavender),transparent); }
.meaning-header { display:flex; align-items:baseline; gap:14px; margin-bottom:6px; }
.meaning-position { font-family:var(--f-title); font-size:10px; letter-spacing:3px;
  text-transform:uppercase; color:var(--teal-lit); }
.meaning-card-name { font-family:var(--f-display); font-size:26px; color:var(--gold); font-weight:700; }
body.chaos-mode .meaning-card-name { font-family:var(--f-chaos); color:var(--hot-pink);
  text-shadow:0 0 15px rgba(255,45,138,0.4); }
.meaning-subtitle { font-style:italic; color:var(--gold-dim); font-size:15px; margin-bottom:18px; }
body.chaos-mode .meaning-subtitle { color:var(--lavender); }
.meaning-divider { height:1px; background:linear-gradient(90deg,var(--gold-dim),transparent);
  margin-bottom:18px; opacity:0.4; }
.meaning-body { color:var(--cream); font-size:16px; line-height:1.8; }
.meaning-keywords { margin-top:18px; display:flex; flex-wrap:wrap; gap:8px; }
.keyword { padding:4px 12px; border:1px solid rgba(201,168,76,0.25); border-radius:20px;
  font-family:var(--f-title); font-size:11px; letter-spacing:2px;
  text-transform:uppercase; color:var(--gold-dim); }
body.chaos-mode .keyword { border-color:rgba(255,45,138,0.25); color:var(--lavender);
  font-family:var(--f-chaos-sub); }

.tarot-combo-note { text-align:center; padding:20px; font-style:italic; color:var(--fog);
  font-size:15px; border-top:1px solid rgba(201,168,76,0.1); margin-top:20px; }
.clear-btn { display:block; margin:30px auto 0; padding:10px 30px; background:transparent;
  border:1px solid rgba(255,255,255,0.1); border-radius:4px; color:var(--fog);
  font-family:var(--f-title); font-size:11px; letter-spacing:3px;
  text-transform:uppercase; cursor:pointer; transition:all 0.3s; }
.clear-btn:hover { border-color:var(--fog); color:var(--mist); }
footer { text-align:center; padding:40px 20px; border-top:1px solid rgba(201,168,76,0.08);
  color:var(--fog); font-size:13px; font-family:var(--f-title); letter-spacing:2px; }
footer span { color:var(--gold-dim); }
body.chaos-mode footer { border-top-color:rgba(255,45,138,0.1); }
body.chaos-mode footer span { color:var(--hot-pink); }
@media(max-width:600px){
  :root{--card-w:150px;--card-h:262px;}
  .meaning-card{padding:24px 20px;}
  .meaning-card-name{font-size:20px;}
  .spread-layout{gap:16px;}
}
</style>
</head>
<body>
<div class="forest-bg"></div>
<div class="chaos-bg"></div>
<div class="fireflies" id="fireflies"></div>
<div class="skulls" id="skulls"></div>

<div class="app">
  <header>
    <span class="header-rune" id="headerRune">✦ &nbsp; The Cards Know &nbsp; ✦</span>
    <h1 id="headerTitle">Nightwood Oracle<span id="headerSub">A Forest Divination Deck</span></h1>
    <div class="header-divider"><span id="headerIcon">🌿</span></div>
  </header>

  <!-- DECK SELECTOR BANNERS -->
  <div class="deck-banners-label">✦ &nbsp; Choose Your Deck &nbsp; ✦</div>
  <div class="deck-banners">
    <div class="deck-banner active" id="bannerNightwood" onclick="setDeck('nightwood')">
      <img src="nightwood_banner.png" onload="this.classList.add('loaded')" onerror="this.style.display='none'" alt="Nightwood Oracle">
      <div class="banner-fallback banner-nightwood">🌲 &nbsp; NIGHTWOOD ORACLE &nbsp; 🌿</div>
    </div>
    <div class="deck-banner" id="bannerCutesy" onclick="setDeck('cutesy')">
      <img src="cutesy_chaos_banner.png" onload="this.classList.add('loaded')" onerror="this.style.display='none'" alt="Cutesy Chaos Tarot">
      <div class="banner-fallback banner-chaos">🐙 &nbsp; CUTESY CHAOS TAROT &nbsp; 💀</div>
    </div>
  </div>

  <div class="spread-section">
    <h2>Choose Your Spread</h2>
    <div class="spread-options" id="spreadOptions"></div>
    <div class="spread-desc" id="spreadDesc"></div>
  </div>

  <div class="draw-section">
    <button class="draw-btn" onclick="doReading()">
      <span id="drawBtnText">✦ &nbsp; Draw the Cards &nbsp; ✦</span>
    </button>
  </div>

  <div class="reading-area" id="readingArea">
    <div class="spread-layout" id="spreadLayout"></div>
    <div class="meaning-panel" id="meaningPanel"></div>
    <button class="clear-btn" id="clearBtn" style="display:none" onclick="clearReading()">✦ Clear Reading ✦</button>
  </div>
</div>

<footer>
  <span id="footerDeck">Nightwood Oracle</span> &nbsp;·&nbsp;
  <span id="footerShop">Unsolicited Deck Pics</span> &nbsp;·&nbsp;
  <span id="footerTag">The forest speaks to those who listen</span>
</footer>

<script>
// ── ORACLE CARDS ───────────────────────────────────────────────────────────
const ORACLE_CARDS = [
  {id:"card 1",name:"The Wolf",file:"card 1.png",type:"oracle",subtitle:"Trust Your Instincts",keywords:["instinct","loyalty","shadow self","freedom","the pack"],meaning:"The Wolf does not ask permission to exist. It moves through the world on instinct sharpened by survival, guided by something older than thought. When Wolf appears, you are being called back to your truest nature — to trust what you feel before you think it, to honor the wild intelligence that lives in your body. You may be navigating pack dynamics, chosen family, or questions of belonging. Wolf asks: are you running with the right people? Are you running at all?"},
  {id:"card 2",name:"The Bear",file:"card 2.png",type:"oracle",subtitle:"Strength & Sovereignty",keywords:["inner strength","boundaries","hibernation","sovereignty","healing"],meaning:"Bear holds more power in stillness than most hold in motion. This is a card of sovereign strength — the kind that doesn't need to announce itself. Bear knows when to emerge and when to go inward. If this card has found you, there may be a season of retreat ahead, not in defeat but in restoration. Your strength needs tending. Hold your territory gently. Hold it firmly."},
  {id:"card 3",name:"The Raven",file:"card 3.png",type:"oracle",subtitle:"Magic & Messages",keywords:["magic","messages","transformation","trickster","the unseen"],meaning:"Raven moves between worlds without apology. It is the trickster, the messenger, the keeper of secrets that were never meant to stay secrets. When Raven lands in your reading, pay attention to what you've been dismissing — a recurring thought, a strange coincidence, a dream that felt too real. Something is trying to get through. Magic is not elsewhere. It is in the ordinary moment turned sideways. Look again."},
  {id:"card 4",name:"The Fox",file:"card 4.png",type:"oracle",subtitle:"Cunning & Adaptability",keywords:["cunning","strategy","adaptability","wit","perception"],meaning:"Fox doesn't fight what it cannot overcome — it outthinks it. There is no shame in cleverness. Fox sees angles that others miss and moves through complexity with playful intelligence. If Fox has come to you, a situation is calling for strategy over force. What do you know that you haven't used yet? Fox asks you to trust your own sharp mind."},
  {id:"card 5",name:"The Owl",file:"card 5.png",type:"oracle",subtitle:"Wisdom & Truth",keywords:["wisdom","night vision","truth","the unspeakable","clarity"],meaning:"Owl sees what others refuse to see. It does not blink at darkness because darkness is simply where truth goes when the light is too harsh. This is a card of deep wisdom — not the kind you learn but the kind you uncover by sitting with discomfort long enough for it to become understanding. The truth you've been avoiding is not as devastating as the energy you're spending to avoid it. Owl says: look directly."},
  {id:"card 6",name:"The Deer",file:"card 6.png",type:"oracle",subtitle:"Gentleness & Grace",keywords:["gentleness","grace","sensitivity","alertness","compassion"],meaning:"Deer is not fragile — Deer is finely tuned. There is a difference between vulnerability and weakness, and Deer knows it. This card arrives when you are being called to lead with your heart rather than your armor. Deer holds extraordinary awareness; its sensitivity is a form of intelligence. If you have been told you feel too much, Deer asks: perhaps the world simply doesn't feel enough."},
  {id:"card 7",name:"The Squirrel",file:"card 7.png",type:"oracle",subtitle:"Preparation & Play",keywords:["preparation","resourcefulness","play","foresight","gathering"],meaning:"Squirrel knows something winter is coming does not cancel summer joy — it just means you dance and gather at the same time. Are you storing what you need? Are you hoarding what no longer serves? Squirrel is resourceful to the point of genius — it finds abundance where others see scarcity. What resources are already in your hands that you haven't recognized as wealth?"},
  {id:"card 8",name:"The Hawk",file:"card 8.png",type:"oracle",subtitle:"Vision & Perspective",keywords:["perspective","clarity","focus","precision","the long view"],meaning:"Hawk doesn't panic because it can see the whole field. From this height, the thing you were tangled in resolves into pattern. You may be too close to something to understand its shape. Hawk's gift is perspective: the ability to hold the large view and the precise strike at once. What would shift if you saw your situation from above? Hawk asks you to rise before you move."},
  {id:"card 9",name:"The Rabbit",file:"card 9.png",type:"oracle",subtitle:"Fear & Fertility",keywords:["fear","fertility","intuition","quickness","abundance"],meaning:"Rabbit holds the paradox of being both the most vulnerable and the most prolific creature in the wood. What you fear, you often draw toward you — not because you are cursed but because fear is a form of attention. This card also carries extraordinary fertile energy: new ideas, new life, new beginnings multiplying faster than expected. What would you create if you weren't afraid?"},
  {id:"card 10",name:"The Snake",file:"card 10.png",type:"oracle",subtitle:"Transformation & Shedding",keywords:["transformation","shedding","rebirth","healing","cycles"],meaning:"Snake does not mourn its old skin — it was simply time. Something must be released entirely, not renegotiated. You have outgrown a version of yourself and holding onto it is costing you more than the fear of shedding it. Snake moves through the world low to the earth, intimate with the ground of being. After the shedding comes sensitivity: everything feels new, raw, vivid. That rawness is aliveness."},
  {id:"card 11",name:"The Porcupine",file:"card 11.png",type:"oracle",subtitle:"Boundaries & Innocence",keywords:["boundaries","innocence","trust","protection","vulnerability"],meaning:"Porcupine is not aggressive — it simply makes the cost of careless approach very clear. The quills are not a wall, they are a boundary. Porcupine still moves through the world with curiosity and playfulness. Can you maintain innocence — the willingness to approach the world openly — while still knowing your own edges?"},
  {id:"card 12",name:"The Moose",file:"card 12.png",type:"oracle",subtitle:"Pride & Presence",keywords:["pride","presence","self-worth","majesty","confidence"],meaning:"Moose is not subtle about its presence. It does not apologize for taking up space. True Moose energy is self-possessed without being self-absorbed: a settled dignity that doesn't need comparison. Walk into the room like you belong there — because you do. Stop making yourself small for people who are simply unused to your size."},
  {id:"card 13",name:"The Butterfly",file:"card 13.png",type:"oracle",subtitle:"Transformation & Joy",keywords:["emergence","joy","change","lightness","becoming"],meaning:"Butterfly did not transform — it dissolved. Before the wings, there was the surrender of every familiar form. If you are in that dark formless stage, know it is not destruction — it is the necessary dissolution before something new can take shape. Butterfly asks: are you willing to stop being what you were in order to become what you are?"},
  {id:"card 14",name:"The Beaver",file:"card 14.png",type:"oracle",subtitle:"Building & Determination",keywords:["building","vision","persistence","community","creation"],meaning:"Beaver changes the landscape. It doesn't find a place that suits it — it makes one. This is the energy of determined, visionary building: the willingness to do the slow, unglamorous work of creating something that will last. Beaver works with what is available, not what is ideal. The creek doesn't stop; the dam doesn't build itself. Pick up the branch."},
  {id:"card 15",name:"The Eagle",file:"card 15.png",type:"oracle",subtitle:"Spirit & Freedom",keywords:["spirit","freedom","divine","leadership","vision"],meaning:"Eagle flies where nothing else can follow. This is a card of spiritual elevation — genuine contact with something larger than the personal. Eagle sees from a perspective that includes the sacred, the ancestral, the connected web of all things. When Eagle appears, you may be receiving a calling or a confirmation. There is a part of you that is vast and unhurried. Lead from there."},
  {id:"card 16",name:"The Mouse",file:"card 16.png",type:"oracle",subtitle:"Detail & The Small Sacred",keywords:["attention","details","scrutiny","the overlooked","focus"],meaning:"Mouse lives in the intimate scale of things. While others look at the horizon, Mouse notices the crack in the floorboard, the crumb, the forgotten corner. There may be fine print in a contract, a pattern in a relationship, a symptom you've been waving away. Mouse asks you to slow down and look closely. The small things are not small — they are the foundation of everything larger."},
  {id:"card 17",name:"The Cougar",file:"card 17.png",type:"oracle",subtitle:"Power & Decisiveness",keywords:["power","leadership","decisiveness","courage","action"],meaning:"Cougar does not second-guess itself at the moment of the leap. All of the patience, all of the watching — it comes down to this decisive instant where power is expressed cleanly. You know more than you're giving yourself credit for. You're ready for more than you're claiming. Cougar asks: what are you still waiting for permission to do?"},
  {id:"card 18",name:"The Turtle",file:"card 18.png",type:"oracle",subtitle:"Patience & Ancient Wisdom",keywords:["patience","groundedness","ancient wisdom","protection","timing"],meaning:"Turtle has been here longer than the panic you're in. This card carries the deep, unhurried wisdom of things that have survived every storm by having nowhere urgent to be. Something in your life is asking for patience: not passive waiting, but active trust in a natural timeline. You carry your home with you. You are more protected than you feel. Breathe. The earth holds you."},
  {id:"card 19",name:"The Firefly",file:"card 19.png",type:"oracle",subtitle:"Hope & Light in Darkness",keywords:["hope","light","magic","inspiration","illumination"],meaning:"Firefly doesn't wait for the sun. It makes its own light, small and improbable and beautiful in the dark. This is the card of hope that doesn't require conditions — the light that shows up not because everything is fine but because something in you refuses to stop shining. You may not know how much your small light means to the people in your night."},
  {id:"card 20",name:"The Frog",file:"card 20.png",type:"oracle",subtitle:"Cleansing & Transition",keywords:["cleansing","rain","transition","abundance","emotion"],meaning:"Frog lives in two worlds and belongs to both. It knows water and earth, submersion and emergence. You are moving between states, between identities, between chapters. Frog also carries the energy of cleansing: what needs to be washed away? The tears you've been holding back are not weakness — they are the water that carries you to the other side."},
];

  {id:"reflection",name:"Reflection",desc:"What is · What is hidden · What is becoming.",positions:["What Is","What Is Hidden","What Is Becoming"],count:3},
  {id:"shadow",name:"Shadow & Light",desc:"Your gift · Your shadow · The bridge between them.",positions:["Your Light","Your Shadow","The Bridge"],count:3},
  {id:"five",name:"Five Card",desc:"Past, present, future, challenge, and guidance.",positions:["Past","Present","Future","The Challenge","The Guide"],count:5},
];
const CUTESY_SPREADS = [
  {id:"single",name:"One Card",desc:"Just one chaotic little card. Embrace it. 🐙",positions:["The Chaos"],count:1},
  {id:"three",name:"Past · Now · Next",desc:"Three cards, maximum chaos, minimum overthinking. 💀",positions:["Past Chaos","Current Chaos","Incoming Chaos"],count:3},
  {id:"heart",name:"Heart Check",desc:"Head · Heart · What the universe is screaming at you. 💕",positions:["Your Head","Your Heart","The Universe 📣"],count:3},
  {id:"five",name:"Full Chaos Spread",desc:"The whole picture, all the feelings, zero chill. 🐉",positions:["The Root","The Heart","The Path","The Obstacle","The Wildcard"],count:5},
  {id:"combo",name:"Tarot + Oracle",desc:"One Cutesy Chaos card sets the stage, one Nightwood Oracle brings the wisdom. 🌲🐙",positions:["Cutesy Chaos: The Energy","Nightwood Oracle: The Wisdom"],tarotCount:1,oracleCount:1,combo:true},
];

// ── STATE ──────────────────────────────────────────────────────────────────
let currentDeck = 'nightwood';
let currentSpread = ORACLE_SPREADS[0];
let drawnCards = [];
let flippedCount = 0;

// ── INIT ───────────────────────────────────────────────────────────────────
function init() {
  spawnParticles();
  renderModes();
  renderSpreads();
}

function spawnParticles() {
  // Fireflies for Nightwood
  const ff = document.getElementById('fireflies');
  for(let i=0;i<22;i++){
    const f=document.createElement('div'); f.className='firefly';
    f.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
      --dur:${6+Math.random()*8}s;--delay:${-Math.random()*10}s;
      --tx:${(Math.random()-0.5)*80}px;--ty:${-20-Math.random()*60}px;
      --tx2:${(Math.random()-0.5)*120}px;--ty2:${-40-Math.random()*80}px;`;
    ff.appendChild(f);
  }
  // Skulls for Cutesy Chaos
  const sk = document.getElementById('skulls');
  const emojis=['💀','🦇','💕','⭐','🐙','🍄','💜','🌙','🐉'];
  for(let i=0;i<20;i++){
    const f=document.createElement('div'); f.className='skull-p';
    f.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    f.style.cssText=`left:${Math.random()*100}%;--sz:${10+Math.random()*18}px;
      --dur:${7+Math.random()*9}s;--delay:${-Math.random()*12}s;opacity:0;`;
    sk.appendChild(f);
  }
}

function setDeck(deck) {
  currentDeck = deck;
  document.getElementById('bannerNightwood').classList.toggle('active', deck==='nightwood');
  document.getElementById('bannerCutesy').classList.toggle('active', deck==='cutesy');

  if(deck==='cutesy') {
    document.body.classList.add('chaos-mode');
    document.getElementById('headerRune').textContent='✦  embrace the chaos, it\'s adorable  ✦';
    document.getElementById('headerTitle').childNodes[0].textContent='Cutesy Chaos Tarot';
    document.getElementById('headerSub').textContent='A Chaotic Little Divination Deck 🐙';
    document.getElementById('headerIcon').textContent='🐙';
    document.getElementById('drawBtnText').textContent='💀  Draw the Cards  💀';
    document.getElementById('footerDeck').textContent='Cutesy Chaos Tarot';
    document.getElementById('footerTag').textContent='embrace the chaos, it\'s adorable 🐙';
    document.querySelector('.skulls').style.opacity='';
    document.querySelector('.fireflies').style.opacity='';
  } else {
    document.body.classList.remove('chaos-mode');
    document.getElementById('headerRune').textContent='✦   The Cards Know   ✦';
    document.getElementById('headerTitle').childNodes[0].textContent='Nightwood Oracle';
    document.getElementById('headerSub').textContent='A Forest Divination Deck';
    document.getElementById('headerIcon').textContent='🌿';
    document.getElementById('drawBtnText').textContent='✦  Draw the Cards  ✦';
    document.getElementById('footerDeck').textContent='Nightwood Oracle';
    document.getElementById('footerTag').textContent='The forest speaks to those who listen';
    document.querySelector('.skulls').style.opacity='';
    document.querySelector('.fireflies').style.opacity='';
  }
  renderModes();
  renderSpreads();
  clearReading(true);
}

function renderModes() {
  const container = document.getElementById('modeTabs');
  container.innerHTML = '';
  // For both decks, just one mode (no sub-modes needed since combo is a spread)
  const label = currentDeck==='cutesy' ? '🐙 Draw Cards' : '🌲 Draw Cards';
  const btn = document.createElement('button');
  btn.className='mode-tab active'; btn.textContent=label;
  container.appendChild(btn);
}

function renderSpreads() {
  const spreads = currentDeck==='cutesy' ? CUTESY_SPREADS : ORACLE_SPREADS;
  const container = document.getElementById('spreadOptions');
  container.innerHTML='';
  spreads.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='spread-btn'+(i===0?' active':'');
    btn.textContent=s.name;
    btn.onclick=()=>selectSpread(s);
    container.appendChild(btn);
  });
  selectSpread(spreads[0]);
}

function selectSpread(spread) {
  currentSpread=spread;
  document.querySelectorAll('.spread-btn').forEach(b=>{
    b.classList.toggle('active',b.textContent===spread.name);
  });
  document.getElementById('spreadDesc').textContent=spread.desc;
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function doReading() {
  try {
  if(!currentSpread || !currentSpread.positions) {
    const spreads = currentDeck==='cutesy' ? CUTESY_SPREADS : ORACLE_SPREADS;
    selectSpread(spreads[0]);
  }
  clearReading(true);
  drawnCards=[]; flippedCount=0;
  const layout=document.getElementById('spreadLayout');
  layout.innerHTML='';

  let cards=[];
  if(currentSpread.combo) {
    // Tarot + Oracle combo
    const tc=shuffle(CUTESY_CARDS).slice(0,1).map(c=>({...c,position:currentSpread.positions[0],reversed:Math.random()<0.25}));
    const oc=shuffle(ORACLE_CARDS).slice(0,1).map(c=>({...c,position:currentSpread.positions[1],reversed:Math.random()<0.15}));
    cards=[...tc,...oc];
  } else {
    const pool=currentDeck==='cutesy'?CUTESY_CARDS:ORACLE_CARDS;
    const shuffled=shuffle(pool);
    cards=shuffled.slice(0,currentSpread.count).map((c,i)=>({
      ...c, position:currentSpread.positions[i], reversed:Math.random()<0.22
    }));
  }
  drawnCards=cards;

  const backFile = (card) => {
    if(card.type==='oracle') return card.reversed?'card 21 back of card reversed.png':'card 21 back of card.png';
    return 'tarot_cutesy_chaos_back.png';
  };

  cards.forEach((card,index)=>{
    const slot=document.createElement('div');
    slot.className='card-slot'+(card.reversed?' is-reversed':'');
    slot.innerHTML=`
      <div class="slot-label">${card.position}</div>
      <div class="card-wrap" id="cardwrap-${index}" style="animation-delay:${index*0.12}s" onclick="flipCard(${index})">
        <div class="card-inner">
          <div class="card-face card-back-face">
            <img src="${backFile(card)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="Card back">
            <div class="placeholder-back" style="display:none"><span style="font-size:48px;opacity:0.6">${card.type==='oracle'?'🌿':'🐙'}</span><span style="font-family:var(--f-title);font-size:11px;letter-spacing:4px;color:var(--gold-dim);text-transform:uppercase">${card.type==='oracle'?'Nightwood':'Cutesy Chaos'}</span></div>
          </div>
          <div class="card-face card-front-face${card.reversed?' card-reversed':''}">
            <img src="${card.file}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="${card.name}">
            <div class="placeholder-front" style="display:none">
              <div style="font-size:48px;margin-bottom:12px">${card.type==='oracle'?'🌲':'🐙'}</div>
              <div style="font-family:var(--f-title);font-size:14px;letter-spacing:2px;color:var(--gold);text-transform:uppercase">${card.name}</div>
            </div>
          </div>
        </div>
      </div>
      ${card.reversed?'<div class="reversed-tag">✦ Reversed</div>':''}
    `;
    layout.appendChild(slot);
  });
  document.getElementById('clearBtn').style.display='block';
  document.getElementById('meaningPanel').classList.remove('visible');
  document.getElementById('meaningPanel').innerHTML='';
  } catch(e) {
    console.error('doReading error:', e);
    document.getElementById('spreadLayout').innerHTML=`<div style="color:#ff2d8a;font-family:sans-serif;padding:20px;text-align:center;">Error: ${e.message}</div>`;
  }
}

function flipCard(index){
  const wrap=document.getElementById(`cardwrap-${index}`);
  if(wrap.classList.contains('flipped'))return;
  wrap.classList.add('flipped');
  flippedCount++;
  setTimeout(()=>showMeaning(index),500);
}

function showMeaning(index){
  const card=drawnCards[index];
  const panel=document.getElementById('meaningPanel');
  for(let el of panel.querySelectorAll('.meaning-card')){if(el.dataset.cardIndex==index)return;}

  const isChaos=card.type==='cutesy';
  const typeTag=isChaos
    ?`<span style="background:rgba(255,45,138,0.15);border:1px solid var(--hot-pink);color:var(--hot-pink);padding:3px 10px;border-radius:20px;font-size:10px;font-family:var(--f-chaos-sub);letter-spacing:2px;text-transform:uppercase;margin-right:10px;">🐙 Cutesy Chaos</span>`
    :`<span style="background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);color:var(--gold-dim);padding:3px 10px;border-radius:20px;font-size:10px;font-family:var(--f-title);letter-spacing:2px;text-transform:uppercase;margin-right:10px;">🌲 Oracle</span>`;

  const reversedNote=card.reversed
    ?`<div style="color:var(--red-dim);font-size:13px;font-family:var(--f-title);letter-spacing:2px;margin-bottom:12px;">✦ REVERSED — energy turned inward</div>`:'' ;

  const mc=document.createElement('div');
  mc.className='meaning-card'; mc.dataset.cardIndex=index;
  mc.innerHTML=`
    <div class="meaning-header">${typeTag}<span class="meaning-position">${card.position}</span></div>
    ${reversedNote}
    <div class="meaning-card-name">${card.name}</div>
    <div class="meaning-subtitle">${card.subtitle||''}</div>
    <div class="meaning-divider"></div>
    <div class="meaning-body">${card.reversed?`<em style="color:var(--fog);display:block;margin-bottom:14px;">Reversed — this energy turns inward.</em>`:''}${card.meaning}</div>
    <div class="meaning-keywords">${(card.keywords||[]).map(k=>`<span class="keyword">${k}</span>`).join('')}</div>
  `;
  panel.appendChild(mc);
  panel.classList.add('visible');
  setTimeout(()=>mc.scrollIntoView({behavior:'smooth',block:'nearest'}),100);

  if(flippedCount===drawnCards.length&&drawnCards.length>1){
    const note=document.createElement('div');
    note.className='tarot-combo-note';
    const msg=currentDeck==='cutesy'?'💀 All cards have spoken. Embrace what emerged. 💕':'✦ All cards have spoken. Sit with what has emerged. The reading is complete.';
    note.innerHTML=`<strong>${msg}</strong>`;
    panel.appendChild(note);
  }
}

function clearReading(silent){
  document.getElementById('spreadLayout').innerHTML='';
  document.getElementById('meaningPanel').innerHTML='';
  document.getElementById('meaningPanel').classList.remove('visible');
  document.getElementById('clearBtn').style.display='none';
  drawnCards=[]; flippedCount=0;
}

window.onload=init;
</script>
</body>
</html>
