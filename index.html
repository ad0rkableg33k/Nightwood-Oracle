<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightwood Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ── ROOT & RESET ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:       #0a0a0f;
  --deep:      #0d1117;
  --bark:      #1a1409;
  --moss:      #1c2918;
  --gold:      #c9a84c;
  --gold-dim:  #7a6230;
  --gold-glow: #e8c96a;
  --teal:      #2d6e6e;
  --teal-lit:  #4db8b8;
  --cream:     #f0e8d5;
  --mist:      #a89f8c;
  --fog:       #5c5650;
  --white:     #faf7f0;
  --red-dim:   #6b2020;

  --f-display: 'Cinzel Decorative', serif;
  --f-title:   'Cinzel', serif;
  --f-body:    'EB Garamond', serif;

  --card-w: 300px;
  --card-h: 523px;
  --card-r: 14px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ── NOISE TEXTURE OVERLAY ───────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.6;
}

/* ── FOREST BACKGROUND ───────────────────────────────────────────────────── */
.forest-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 100%, #0d2210 0%, transparent 70%),
    radial-gradient(ellipse 100% 60% at 50% 110%, #060e04 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 20% 80%, #0a1a08 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 80% 80%, #0a1a08 0%, transparent 50%),
    linear-gradient(180deg, #050508 0%, #080d06 40%, #040804 100%);
}

/* Firefly particles */
.fireflies {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}
.firefly {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-glow);
  box-shadow: 0 0 6px 2px rgba(232,201,106,0.6);
  animation: drift var(--dur, 8s) ease-in-out infinite var(--delay, 0s);
  opacity: 0;
}
@keyframes drift {
  0%   { opacity:0; transform: translate(0,0) scale(0.5); }
  20%  { opacity:0.8; }
  50%  { opacity:0.4; transform: translate(var(--tx,20px), var(--ty,-30px)) scale(1); }
  80%  { opacity:0.7; }
  100% { opacity:0; transform: translate(var(--tx2,40px), var(--ty2,-60px)) scale(0.3); }
}

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
.app { position: relative; z-index: 2; min-height: 100vh; }

/* ── HEADER ──────────────────────────────────────────────────────────────── */
header {
  text-align: center;
  padding: 60px 20px 40px;
  position: relative;
}
.header-rune {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold-dim);
  font-family: var(--f-title);
  margin-bottom: 16px;
  display: block;
}
header h1 {
  font-family: var(--f-display);
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 900;
  color: var(--gold);
  text-shadow:
    0 0 40px rgba(201,168,76,0.4),
    0 0 80px rgba(201,168,76,0.15);
  line-height: 1.1;
  letter-spacing: 2px;
}
header h1 span {
  display: block;
  font-size: 0.45em;
  font-weight: 400;
  color: var(--mist);
  letter-spacing: 8px;
  margin-top: 6px;
  font-family: var(--f-title);
}
.header-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 400px;
  margin: 24px auto 0;
}
.header-divider::before,
.header-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim));
}
.header-divider::after {
  background: linear-gradient(90deg, var(--gold-dim), transparent);
}
.header-divider span {
  color: var(--gold);
  font-size: 18px;
}

/* ── MODE SELECTOR ───────────────────────────────────────────────────────── */
.mode-section {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 20px 0;
  text-align: center;
}
.mode-section h2 {
  font-family: var(--f-title);
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--fog);
  margin-bottom: 16px;
}
.mode-tabs {
  display: inline-flex;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 50px;
  padding: 4px;
  gap: 4px;
}
.mode-tab {
  padding: 10px 24px;
  border-radius: 40px;
  border: none;
  background: transparent;
  color: var(--fog);
  font-family: var(--f-title);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.mode-tab:hover { color: var(--cream); }
.mode-tab.active {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 0 20px rgba(201,168,76,0.3);
}

/* ── SPREAD SELECTOR ─────────────────────────────────────────────────────── */
.spread-section {
  max-width: 900px;
  margin: 30px auto 0;
  padding: 0 20px;
  text-align: center;
}
.spread-section h2 {
  font-family: var(--f-title);
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--fog);
  margin-bottom: 16px;
}
.spread-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.spread-btn {
  padding: 10px 22px;
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 6px;
  background: rgba(255,255,255,0.02);
  color: var(--mist);
  font-family: var(--f-title);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s;
}
.spread-btn:hover {
  border-color: var(--gold-dim);
  color: var(--cream);
  background: rgba(201,168,76,0.06);
}
.spread-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(201,168,76,0.1);
  box-shadow: 0 0 14px rgba(201,168,76,0.15);
}
.spread-desc {
  margin-top: 12px;
  font-style: italic;
  color: var(--fog);
  font-size: 14px;
  min-height: 22px;
}

/* ── DRAW BUTTON ─────────────────────────────────────────────────────────── */
.draw-section {
  text-align: center;
  padding: 30px 20px 10px;
}
.draw-btn {
  position: relative;
  padding: 18px 52px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: 4px;
  color: var(--gold);
  font-family: var(--f-display);
  font-size: 15px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.4s;
  overflow: hidden;
}
.draw-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  opacity: 0;
  transition: opacity 0.4s;
}
.draw-btn:hover::before { opacity: 1; }
.draw-btn:hover { color: var(--ink); box-shadow: 0 0 30px rgba(201,168,76,0.4); }
.draw-btn span { position: relative; z-index: 1; }
.draw-btn:active { transform: scale(0.97); }

/* ── READING AREA ────────────────────────────────────────────────────────── */
.reading-area {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px 60px;
}

/* ── SPREAD LAYOUT ───────────────────────────────────────────────────────── */
.spread-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  justify-content: center;
  margin-bottom: 50px;
}

/* ── CARD SLOT ───────────────────────────────────────────────────────────── */
.card-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.slot-label {
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold-dim);
  text-align: center;
}

/* ── THE CARD ────────────────────────────────────────────────────────────── */
.card-wrap {
  width: var(--card-w);
  height: var(--card-h);
  perspective: 1000px;
  cursor: pointer;
}
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: var(--card-r);
}
.card-wrap.flipped .card-inner {
  transform: rotateY(180deg);
}
.card-face {
  position: absolute;
  inset: 0;
  border-radius: var(--card-r);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.6),
    0 0 0 1px rgba(201,168,76,0.15),
    0 0 20px rgba(201,168,76,0.05);
}
.card-back-face {
  background: var(--deep);
}
.card-back-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--card-r);
}
/* Placeholder back if image missing */
.card-back-face .placeholder-back {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0d1a2e, #1a0d2e);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: var(--card-r);
}
.placeholder-back .card-sigil {
  font-size: 48px;
  opacity: 0.6;
}
.placeholder-back span {
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold-dim);
  text-transform: uppercase;
}

.card-front-face {
  transform: rotateY(180deg);
  background: var(--deep);
}
.card-front-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--card-r);
}
.card-front-face .placeholder-front {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, #0d1a0d, #1a130d);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
  text-align: center;
  border-radius: var(--card-r);
}
.placeholder-front .card-animal {
  font-size: 52px;
  margin-bottom: 12px;
}
.placeholder-front .card-name-text {
  font-family: var(--f-title);
  font-size: 16px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
}

/* Card deal animation */
.card-wrap {
  opacity: 0;
  transform: translateY(20px);
  animation: dealIn 0.5s ease forwards;
}
@keyframes dealIn {
  to { opacity: 1; transform: translateY(0); }
}

/* Reversed card indicator */
.card-wrap.reversed .card-inner {
  /* will show upside down on front face */
}
.reversed-tag {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--red-dim);
  text-transform: uppercase;
  display: none;
}
.card-slot.is-reversed .reversed-tag { display: block; }

/* ── CARD MEANING PANEL ──────────────────────────────────────────────────── */
.meaning-panel {
  max-width: 700px;
  margin: 0 auto;
  display: none;
  animation: fadeUp 0.5s ease forwards;
}
.meaning-panel.visible { display: block; }
@keyframes fadeUp {
  from { opacity:0; transform: translateY(16px); }
  to   { opacity:1; transform: translateY(0); }
}

.meaning-card {
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 12px;
  padding: 36px 40px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.meaning-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.meaning-header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 6px;
}
.meaning-position {
  font-family: var(--f-title);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--teal-lit);
}
.meaning-card-name {
  font-family: var(--f-display);
  font-size: 26px;
  color: var(--gold);
  font-weight: 700;
}
.meaning-subtitle {
  font-style: italic;
  color: var(--gold-dim);
  font-size: 15px;
  margin-bottom: 18px;
}
.meaning-divider {
  height: 1px;
  background: linear-gradient(90deg, var(--gold-dim), transparent);
  margin-bottom: 18px;
  opacity: 0.4;
}
.meaning-body {
  color: var(--cream);
  font-size: 16px;
  line-height: 1.8;
}
.meaning-keywords {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.keyword {
  padding: 4px 12px;
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 20px;
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold-dim);
}

/* ── TAROT COMBO SECTION ─────────────────────────────────────────────────── */
.tarot-combo-note {
  text-align: center;
  padding: 20px;
  font-style: italic;
  color: var(--fog);
  font-size: 15px;
  border-top: 1px solid rgba(201,168,76,0.1);
  margin-top: 20px;
}
.tarot-combo-note strong { color: var(--gold-dim); font-style: normal; }

/* ── CLEAR BUTTON ────────────────────────────────────────────────────────── */
.clear-btn {
  display: block;
  margin: 30px auto 0;
  padding: 10px 30px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px;
  color: var(--fog);
  font-family: var(--f-title);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.clear-btn:hover { border-color: var(--fog); color: var(--mist); }

/* ── FOOTER ──────────────────────────────────────────────────────────────── */
footer {
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid rgba(201,168,76,0.08);
  color: var(--fog);
  font-size: 13px;
  font-family: var(--f-title);
  letter-spacing: 2px;
}
footer span { color: var(--gold-dim); }

/* ── SCROLL REVEAL ───────────────────────────────────────────────────────── */
.hidden-section { opacity: 0; transition: opacity 0.6s ease; }
.hidden-section.revealed { opacity: 1; }

/* ── RESPONSIVE ──────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  :root { --card-w: 150px; --card-h: 315px; }
  .meaning-card { padding: 24px 20px; }
  .meaning-card-name { font-size: 20px; }
  .spread-layout { gap: 16px; }
}
</style>
</head>
<body>

<div class="forest-bg"></div>
<div class="fireflies" id="fireflies"></div>

<div class="app">

  <!-- HEADER -->
  <header>
    <span class="header-rune">✦ &nbsp; The Cards Know &nbsp; ✦</span>
    <h1>Nightwood Oracle<span>A Forest Divination Deck</span></h1>
    <div class="header-divider"><span>🌿</span></div>
  </header>

  <!-- MODE TABS -->
  <div class="mode-section">
    <h2>Choose Your Path</h2>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="oracle" onclick="setMode('oracle')">Oracle Only</button>
      <button class="mode-tab" data-mode="tarot" onclick="setMode('tarot')">Tarot + Oracle</button>
    </div>
  </div>

  <!-- SPREAD SELECTOR -->
  <div class="spread-section">
    <h2>Choose Your Spread</h2>
    <div class="spread-options" id="spreadOptions"></div>
    <div class="spread-desc" id="spreadDesc"></div>
  </div>

  <!-- DRAW -->
  <div class="draw-section">
    <button class="draw-btn" onclick="doReading()">
      <span>✦ &nbsp; Draw the Cards &nbsp; ✦</span>
    </button>
  </div>

  <!-- READING AREA -->
  <div class="reading-area" id="readingArea">
    <div class="spread-layout" id="spreadLayout"></div>
    <div class="meaning-panel" id="meaningPanel"></div>
    <button class="clear-btn" id="clearBtn" style="display:none" onclick="clearReading()">✦ Clear Reading ✦</button>
  </div>

</div>

<footer>
  <span>Nightwood Oracle</span> &nbsp;·&nbsp; The forest speaks to those who listen
</footer>

// ── STATE ──────────────────────────────────────────────────────────────────
let currentMode = 'oracle';
let currentSpread = ORACLE_SPREADS[0];
let drawnCards = [];
let flippedCount = 0;

// ── INIT ───────────────────────────────────────────────────────────────────
function init() {
  spawnFireflies();
  renderSpreads();
  selectSpread(ORACLE_SPREADS[0]);
}

function spawnFireflies() {
  const container = document.getElementById('fireflies');
  for (let i = 0; i < 22; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.cssText = `
      left: ${Math.random()*100}%;
      top: ${Math.random()*100}%;
      --dur: ${6 + Math.random()*8}s;
      --delay: ${-Math.random()*10}s;
      --tx: ${(Math.random()-0.5)*80}px;
      --ty: ${-20 - Math.random()*60}px;
      --tx2: ${(Math.random()-0.5)*120}px;
      --ty2: ${-40 - Math.random()*80}px;
    `;
    container.appendChild(f);
  }
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  renderSpreads();
  clearReading();
}

function renderSpreads() {
  const spreads = currentMode === 'oracle' ? ORACLE_SPREADS : TAROT_COMBO_SPREADS;
  const container = document.getElementById('spreadOptions');
  container.innerHTML = '';
  spreads.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'spread-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.name;
    btn.onclick = () => selectSpread(s);
    container.appendChild(btn);
  });
  selectSpread(spreads[0]);
}

function selectSpread(spread) {
  currentSpread = spread;
  document.querySelectorAll('.spread-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === spread.name);
  });
  document.getElementById('spreadDesc').textContent = spread.desc;
}

// ── SHUFFLE & DRAW ─────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function doReading() {
  clearReading(true);
  drawnCards = [];
  flippedCount = 0;

  const layout = document.getElementById('spreadLayout');
  layout.innerHTML = '';

  let positions, cards;

  if (currentMode === 'oracle') {
    const shuffled = shuffle(ORACLE_CARDS);
    positions = currentSpread.positions;
    cards = shuffled.slice(0, currentSpread.count).map((c, i) => ({
      ...c,
      type: 'oracle',
      position: positions[i],
      reversed: Math.random() < 0.25
    }));
  } else {
    positions = currentSpread.positions;
    const shuffledTarot = shuffle(TAROT_CARDS);
    const shuffledOracle = shuffle(ORACLE_CARDS);
    let ti = 0, oi = 0;
    cards = positions.map((pos, i) => {
      const isOracle = pos.toLowerCase().includes('oracle');
      if (isOracle) {
        return { ...shuffledOracle[oi++], type: 'oracle', position: pos, reversed: Math.random() < 0.2 };
      } else {
        return { ...shuffledTarot[ti++], type: 'tarot', position: pos, reversed: Math.random() < 0.3 };
      }
    });
  }

  drawnCards = cards;

  cards.forEach((card, index) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot' + (card.reversed ? ' is-reversed' : '');
    slot.innerHTML = `
      <div class="slot-label">${card.position}</div>
      <div class="card-wrap" id="cardwrap-${index}" style="animation-delay:${index * 0.12}s" onclick="flipCard(${index})">
        <div class="card-inner">
          <div class="card-face card-back-face">
            <img src="card 21 back of card reversed.png"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              alt="Card back">
            <div class="placeholder-back" style="display:none">
              <div class="card-sigil">🌿</div>
              <span>Nightwood</span>
            </div>
          </div>
          <div class="card-face card-front-face">
            ${card.type === 'oracle'
              ? `<img src="${card.file}"
                  onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                  alt="${card.name}"
                  style="${card.reversed ? 'transform:rotate(180deg);transform-origin:25% center;' : ''}">
                 <div class="placeholder-front" style="display:none">
                   <div class="card-animal">🌲</div>
                   <div class="card-name-text">${card.name}</div>
                 </div>`
              : `<div class="placeholder-front" style="background: linear-gradient(160deg, #0d0d1a, #1a0d1a);">
                   <div class="card-animal">${getTarotEmoji(card.arcana)}</div>
                   <div class="card-name-text">${card.name}</div>
                 </div>`
            }
          </div>
        </div>
      </div>
      ${card.reversed ? '<div class="reversed-tag">✦ Reversed</div>' : ''}
    `;
    layout.appendChild(slot);
  });

  document.getElementById('clearBtn').style.display = 'block';
  document.getElementById('meaningPanel').classList.remove('visible');
  document.getElementById('meaningPanel').innerHTML = '';
}

function getTarotEmoji(arcana) {
  const map = { Major: '⭐', Wands: '🔥', Cups: '🌊', Swords: '⚔️', Pentacles: '🌕' };
  return map[arcana] || '✨';
}

function flipCard(index) {
  const wrap = document.getElementById(`cardwrap-${index}`);
  if (wrap.classList.contains('flipped')) return;
  wrap.classList.add('flipped');
  flippedCount++;

  // Show meaning after short delay
  setTimeout(() => showMeaning(index), 500);
}

  const card = drawnCards[index];
  const panel = document.getElementById('meaningPanel');

  const reversedNote = card.reversed
    ? `<div style="color:var(--red-dim);font-size:13px;font-family:var(--f-title);letter-spacing:2px;margin-bottom:12px;">✦ REVERSED — energy turned inward</div>`
    : '';

  const typeTag = card.type === 'tarot'
    ? `<span style="background:rgba(45,110,110,0.2);border:1px solid var(--teal);color:var(--teal-lit);padding:3px 10px;border-radius:20px;font-size:10px;font-family:var(--f-title);letter-spacing:2px;text-transform:uppercase;margin-right:10px;">Tarot · ${card.arcana}</span>`
    : `<span style="background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);color:var(--gold-dim);padding:3px 10px;border-radius:20px;font-size:10px;font-family:var(--f-title);letter-spacing:2px;text-transform:uppercase;margin-right:10px;">Oracle</span>`;

  const existingCards = panel.querySelectorAll('.meaning-card');
  // Don't duplicate
  for (let el of existingCards) {
    if (el.dataset.cardIndex == index) return;
  }

  const mc = document.createElement('div');
  mc.className = 'meaning-card';
  mc.dataset.cardIndex = index;
  mc.innerHTML = `
    <div class="meaning-header">
      ${typeTag}
      <span class="meaning-position">${card.position}</span>
    </div>
    ${reversedNote}
    <div class="meaning-card-name">${card.name}</div>
    <div class="meaning-subtitle">${card.subtitle || card.keywords?.join(' · ')}</div>
    <div class="meaning-divider"></div>
    <div class="meaning-body">${card.reversed
      ? `<em style="color:var(--fog);display:block;margin-bottom:14px;">When reversed, this energy turns inward — the invitation becomes more personal, the work more internal.</em>` + card.meaning
      : card.meaning}</div>
    <div class="meaning-keywords">
      ${(card.keywords||[]).map(k => `<span class="keyword">${k}</span>`).join('')}
    </div>
  `;
  panel.appendChild(mc);
  panel.classList.add('visible');

  // Smooth scroll to meaning
  setTimeout(() => mc.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);

  // If all cards flipped, show completion note
  if (flippedCount === drawnCards.length && drawnCards.length > 1) {
    const note = document.createElement('div');
    note.className = 'tarot-combo-note';
    note.innerHTML = `<strong>✦ All cards have spoken.</strong> Sit with what has emerged. The reading is complete.`;
    panel.appendChild(note);
  }
}

function clearReading(silent) {
  document.getElementById('spreadLayout').innerHTML = '';
  document.getElementById('meaningPanel').innerHTML = '';
  document.getElementById('meaningPanel').classList.remove('visible');
  document.getElementById('clearBtn').style.display = 'none';
  drawnCards = [];
  flippedCount = 0;
}

window.onload = init;
</script>
</body>
</html>
